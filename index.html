<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#0e0f11">
<title>Treino</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e0f11;--card:#17191d;--card2:#20232a;--line:#2b2f37;--tx:#f2f3f5;--mut:#8d939e;--acc:#8f7dff;--acc2:#4f8cff;--grad:linear-gradient(135deg,#4f8cff,#9d5cff);--accd:rgba(143,125,255,.16);--red:#ff6161;--blue:#62b4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.35}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:none;display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
header h1{font-size:22px;margin:0;letter-spacing:-.3px}
.sync{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;margin:10px 0 12px;overflow-x:auto}
.chip{flex:1;min-width:52px;padding:9px 0;border-radius:12px;background:var(--card);text-align:center;font-weight:600;font-size:14px;color:var(--mut);position:relative}
.chip.on{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(124,92,255,.35)}
.chip.dn::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chip.on.dn::after{background:#fff}
.seg2{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:8px 0 12px}
.seg2 button{flex:1;padding:8px;border-radius:9px;font-size:14px;color:var(--mut);font-weight:600}
.seg2 button.on{background:var(--card2);color:var(--tx)}
.note{background:var(--card);border-left:3px solid var(--acc);padding:10px 12px;border-radius:10px;font-size:14px;color:var(--mut);margin-bottom:12px}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;margin:4px 0 10px;gap:10px}
.dtitle{font-size:20px;font-weight:700;letter-spacing:-.3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--accd);color:var(--acc)}
.ghost{padding:7px 12px;border-radius:10px;background:var(--card);font-size:14px;color:var(--mut);white-space:nowrap}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;scroll-margin-top:90px}
.exn{font-weight:650;font-size:16px}
.exm{font-size:13px;color:var(--mut);margin-top:2px}
.last{font-size:13px;color:var(--mut);margin:8px 0 10px;padding:7px 9px;background:var(--card2);border-radius:9px}
.up{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--grad);padding:2px 8px;border-radius:20px;margin-left:6px}
.up.warn{background:var(--red)}
.set{display:flex;align-items:center;gap:7px;margin-top:7px}
.set .sn{width:22px;text-align:center;color:var(--mut);font-size:14px;font-weight:600}
.set input{text-align:center;padding:10px 4px;font-weight:600}
.set .ul{font-size:11px;color:var(--mut);width:42px;line-height:1.1}
.chk{width:44px;height:42px;flex:none;border-radius:11px;background:var(--card2);color:var(--mut);font-size:18px;font-weight:700}
.set.done .chk{background:var(--grad);color:#fff}
.set.done input{border-color:transparent;background:var(--accd);color:var(--acc)}
.addset{font-size:13px;color:var(--mut);margin-top:9px;padding:4px 0}
.primary{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(124,92,255,.3);font-weight:700;border-radius:14px;padding:13px 16px}
.big{width:100%;font-size:17px;margin:6px 0 10px;padding:15px}
.link{color:var(--mut);font-size:14px;text-decoration:underline;display:block;margin:4px auto 16px}
.danger{color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,15,17,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:4px 0}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:19;max-width:536px;margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timer.show{display:flex}
#timer.end{border-color:var(--acc);background:#1d1838}
#timer .tt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
#timer .tl{font-size:12px;color:var(--mut)}
#timer button{background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border-radius:14px;padding:10px}
.stat .v{font-size:19px;font-weight:700}
.stat .k{font-size:12px;color:var(--mut)}
.pos{color:var(--acc)}.neg{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row .r1{font-weight:600;font-size:15px}
.row .r2{font-size:12px;color:var(--mut);margin-top:2px}
.row.sel .r1{color:var(--acc)}
.bar{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.h2{font-size:15px;font-weight:700;margin:16px 2px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-size:12px}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.inl{display:flex;gap:8px}
.inl input{flex:1}
svg.chart{width:100%;height:auto;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 14px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:19px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
.sheet label input,.sheet label select{margin-top:4px}
.erow{display:flex;gap:8px;align-items:flex-end}
.erow>*{flex:1}
.ebtns{display:flex;gap:6px;flex:none;margin-bottom:8px}
.ebtns button{width:38px;height:40px;border-radius:10px;background:var(--card2);font-weight:700}
.mrow{display:flex;gap:8px;margin-top:12px}
.mrow>*{flex:1}
.mrow .ghost{padding:13px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.body svg{width:100%;height:auto}
.legend{display:flex;justify-content:space-around;font-size:12px;color:var(--mut);margin-top:-4px}
.sumx{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumx:last-child{border:0}
.prog{position:sticky;top:0;z-index:15;background:rgba(14,15,17,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -14px 10px;padding:calc(8px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.prog .pt{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);min-height:34px}
.prog .pt b{color:var(--tx)}
.pbtn{background:var(--grad);color:#fff;font-weight:700;border-radius:10px;padding:7px 14px;font-size:14px}
.hello{font-size:15px;color:var(--mut);margin:2px 2px 4px}
.tips{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;font-size:14px}
.tips b{display:block;font-size:16px;margin-bottom:8px}
.tips div{display:flex;gap:10px;margin:7px 0;color:var(--mut)}
.tips span.i{flex:none;width:24px;height:24px;border-radius:8px;background:var(--accd);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tips button{margin-top:6px;width:100%}
.card.ok{padding:12px 14px;display:flex;align-items:center;gap:12px;opacity:.85}
.card.ok .okc{flex:none;width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.card.ok .exm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exhead .cnt{font-size:13px;color:var(--mut);white-space:nowrap;padding-top:2px}
.exhead .cnt.full{color:var(--acc);font-weight:700}
.hint{font-size:12px;color:var(--mut);text-align:center;margin:-2px 0 12px}
.pr{font-size:11px;font-weight:800;color:#fff;background:var(--grad);padding:1px 6px;border-radius:6px;margin-left:5px}
.over{color:var(--red);font-weight:700}
.exbtns{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:9px}
.exbtns button{font-size:13px;color:var(--mut);padding:4px 0;margin:0}
.exnote{font-size:13px;color:var(--tx);margin:-2px 0 10px;padding:7px 9px;background:var(--accd);border-radius:9px;white-space:pre-wrap;word-break:break-word}
.swapof{font-size:12px;color:var(--acc);margin-top:2px}
.nbtns{display:flex;gap:8px;margin-top:9px}
.warm{font-size:12px;color:var(--mut);margin:-4px 2px 10px}
.warm.prt{color:var(--acc);font-weight:650}
.shortbtn{color:var(--acc);font-size:13px;padding:0}
.shortbtn.on{font-weight:800}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead button{width:34px;height:30px;border-radius:9px;background:var(--card2);font-size:18px}
.calhead button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal i{font-style:normal;font-size:11px;color:var(--mut)}
.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;color:var(--mut);background:var(--card2)}
.cal span:empty{background:none}
.cal span.today{outline:1.5px solid var(--acc)}
.cal span.done{background:var(--accd);color:var(--acc);font-weight:700}
.cal span.hi,.dot.hi{background:var(--grad);color:#fff;font-weight:700}
.cal span.mid,.dot.mid{background:#4a4f5c;color:#fff}
.cal span.low,.dot.low{background:#7a3b46;color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:-1px;margin-left:4px}
.game{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0 10px}
.rank{width:42px;height:42px;flex:none;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:21px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;line-height:1.25}
.ach span{display:block;font-size:24px;margin-bottom:4px}
.ach small{display:block;color:var(--mut);font-size:10.5px;margin-top:3px}
.ach .off{opacity:.35;filter:grayscale(1)}
.xpbox{background:var(--accd);color:var(--acc);border-radius:12px;padding:10px 12px;margin:-4px 0 12px;font-size:14px}
.xpbox b{font-size:17px}
.lvup{margin-top:6px;font-weight:800;color:var(--tx)}
.card label{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
.card label input{margin-top:4px}
.feelq{font-size:14px;font-weight:650;margin:2px 2px 8px}
.feels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.feels button{background:var(--card);border-radius:12px;padding:9px 2px;font-size:11px;color:var(--mut);line-height:1.2}
.feels button span{display:block;font-size:22px;margin-bottom:3px}
.feels button.on{background:var(--grad);color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="htitle">Treino</h1><span class="sync" id="sync">salvo no celular</span></header>
  <main id="main"></main>
</div>
<div id="timer"><div style="flex:1"><div class="tl">Descanso</div><div class="tt" id="tt">1:30</div></div><button data-act="tminus">−15</button><button data-act="tplus">+15</button><button data-act="tclose">✕</button></div>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
// ---------- Base ----------
const MUSCLES={peito:'Peito',ombro_frontal:'Ombro frontal',ombro_lateral:'Ombro lateral',ombro_posterior:'Ombro posterior',trapezio:'Trapézio',costas:'Costas',lombar:'Lombar',biceps:'Bíceps',triceps:'Tríceps',antebraco:'Antebraço',abdomen:'Abdômen',quadriceps:'Quadríceps',posterior_coxa:'Posterior de coxa',gluteos:'Glúteos',panturrilha:'Panturrilha',adutores:'Adutores',cardio:'Cardio'};
const UNITS={kg:{l:'kg',w:'kg',r:'reps'},kglado:{l:'kg/lado',w:'kg/lado',r:'reps'},placas:{l:'placas',w:'placas',r:'reps'},corpo:{l:'peso corporal',w:null,r:'reps'},cardio:{l:'cardio',w:'min',r:'km/h'}};
const DAYS=[['seg','Seg','Segunda'],['ter','Ter','Terça'],['qua','Qua','Quarta'],['qui','Qui','Quinta'],['sex','Sex','Sexta']];
function E(id,name,sets,reps,unit,p,s,ref){return {id,name,sets,reps,unit,p,s:s||[],ref:ref||[]}}
const C=e=>(e.c=true,e);
const BS=(e,g)=>(e.bs=g,e);
const B=e=>(e.bar=true,e);
// Faixas permitidas: com carga só 6-8 ou 8-10; abdômen de peso corporal 15-20
const repsFor=u=>u==='corpo'?['15-20','8-10','6-8']:['6-8','8-10'];
const fixReps=e=>{if(e.unit!=='cardio'&&!repsFor(e.unit).includes(e.reps))e.reps=e.unit==='corpo'?'15-20':'8-10'};
// v2: shape em V — ombro lateral, costas largas e densas, braços; sem stiff, desenvolvimento e esteira
const DEFAULT_PLAN={v:4,days:{
 seg:{name:'Peito + Ombro lateral + Tríceps',ex:[
  B(C(E('supino_reto','Supino reto (barra)',3,'6-8','kglado',['peito'],['ombro_frontal','triceps'],[40,45,45]))),
  B(C(E('supino_incl_barra','Supino inclinado (barra)',3,'8-10','kglado',['peito'],['ombro_frontal','triceps'],[30,35,35]))),
  E('elev_lateral','Elevação lateral (halteres)',4,'8-10','kg',['ombro_lateral'],['trapezio'],[14]),
  E('triceps_polia_w','Tríceps na polia (barra W)',3,'8-10','kg',['triceps'],[],[100]),
  E('frances_corda','Tríceps francês na polia (corda)',3,'8-10','kg',['triceps'],[],[80])]},
 ter:{name:'Costas + Bíceps',ex:[
  B(C(E('remada_curvada','Remada curvada (barra)',3,'6-8','kglado',['costas'],['ombro_posterior','biceps','lombar'],[25,25,25]))),
  C(E('puxada_aberta','Puxada aberta no pulley',3,'8-10','placas',['costas'],['biceps'],[15])),
  C(E('remada_uni','Remada serrote (halter)',3,'8-10','kg',['costas'],['biceps','ombro_posterior'])),
  E('pulldown_corda','Pulldown com corda (cross)',2,'8-10','kg',['costas'],[],[80]),
  E('rosca_direta_polia','Rosca direta na polia (barra W)',3,'8-10','kg',['biceps'],['antebraco'],[70]),
  E('rosca_inclinada','Rosca inclinada (halteres)',3,'8-10','kg',['biceps'])]},
 qua:{name:'Pernas + Abdômen',ex:[
  C(E('leg_press','Leg press',4,'6-8','kg',['quadriceps'],['gluteos'])),
  E('extensora','Cadeira extensora',3,'8-10','kg',['quadriceps']),
  E('mesa_flexora','Mesa flexora',3,'8-10','kg',['posterior_coxa']),
  B(E('elevacao_pelvica','Elevação pélvica (barra)',2,'8-10','kglado',['gluteos'],['posterior_coxa'])),
  E('panturrilha_lp','Panturrilha no leg press',3,'8-10','kg',['panturrilha']),
  E('abd_supra','Abdominal supra (pernas elevadas)',3,'15-20','corpo',['abdomen'])]},
 qui:{name:'Peito + Costas',ex:[
  C(E('supino_incl_halter','Supino inclinado (halteres)',3,'8-10','kg',['peito'],['ombro_frontal','triceps'])),
  C(E('puxada_triangulo','Puxada com triângulo no pulley',3,'8-10','placas',['costas'],['biceps'])),
  E('crossover','Crossover polia alta',3,'8-10','kglado',['peito'],[],[50]),
  C(E('remada_baixa_cross','Remada baixa no cross (triângulo)',3,'8-10','kg',['costas'],['biceps','ombro_posterior'])),
  E('cross_baixo','Crossover polia baixa',2,'8-10','kglado',['peito'])]},
 sex:{name:'Ombros + Braços + Abdômen',ex:[
  E('elev_lat_cross','Elevação lateral unilateral no cross',4,'8-10','kg',['ombro_lateral']),
  E('posterior_cross','Posterior de ombro no cross',4,'8-10','placas',['ombro_posterior'],['trapezio'],[4]),
  BS(E('rosca_martelo','Rosca martelo (halteres)',3,'8-10','kg',['biceps'],['antebraco'],[20]),'b1'),
  BS(E('triceps_corda','Tríceps na polia (corda)',3,'8-10','kg',['triceps']),'b1'),
  E('rosca_inversa','Rosca inversa na polia',2,'8-10','kg',['antebraco'],['biceps']),
  E('abd_vup','Abdominal canivete (V-up)',3,'15-20','corpo',['abdomen'])]}
}};
// Alternativas para a troca do dia, só com o que tem na academia
const CATALOG=[
 C(E('alt_supino_halter','Supino reto (halteres)',3,'8-10','kg',['peito'],['ombro_frontal','triceps'])),
 E('alt_crucifixo','Crucifixo (halteres)',3,'8-10','kg',['peito']),
 B(C(E('desenv_militar','Desenvolvimento militar em pé',3,'6-8','kglado',['ombro_frontal'],['ombro_lateral','triceps'],[20]))),
 C(E('arnold','Arnold press (halteres)',3,'8-10','kg',['ombro_frontal'],['ombro_lateral','triceps'],[28])),
 C(E('alt_desenv_halter','Desenvolvimento (halteres)',3,'8-10','kg',['ombro_frontal'],['ombro_lateral','triceps'])),
 E('elev_lat_uni','Elevação lateral unilateral (halter)',3,'8-10','kg',['ombro_lateral']),
 E('alt_crucifixo_inv','Crucifixo inverso (halteres)',3,'8-10','kg',['ombro_posterior'],['trapezio']),
 B(E('encolhimento','Encolhimento (barra)',3,'8-10','kglado',['trapezio'],['antebraco'],[40,45,50])),
 E('alt_encolh_halter','Encolhimento (halteres)',3,'8-10','kg',['trapezio'],['antebraco']),
 C(E('barra_fixa','Barra fixa aberta',3,'6-8','corpo',['costas'],['biceps','ombro_posterior'])),
 C(E('alt_remada_halter','Remada curvada (halteres)',3,'8-10','kg',['costas'],['ombro_posterior','biceps','lombar'])),
 E('rosca_alternada','Rosca alternada (halteres)',3,'8-10','kg',['biceps'],['antebraco']),
 E('alt_rosca_w','Rosca direta (barra W)',3,'8-10','kglado',['biceps'],['antebraco']),
 E('alt_rosca_corda','Rosca na polia com corda',3,'8-10','kg',['biceps'],['antebraco']),
 E('alt_tri_testa','Tríceps testa (barra W)',3,'8-10','kglado',['triceps']),
 E('alt_tri_uni','Tríceps unilateral na polia',3,'8-10','kg',['triceps']),
 C(E('alt_lp_uni','Leg press unilateral',3,'8-10','kg',['quadriceps'],['gluteos'])),
 B(C(E('stiff','Stiff (barra)',3,'8-10','kglado',['posterior_coxa'],['gluteos','lombar']))),

const validSets=(sets,unit)=>sets.filter(s=>unit==='cardio'?s.w!=null:s.r!=null);
function metric(sets,unit,m){
 const S=validSets(sets,unit);if(!S.length)return null;
 if(unit==='cardio')return m==='vol'?S.reduce((a,s)=>a+(s.w||0),0):Math.max(...S.map(s=>s.w||0));
 if(unit==='corpo')return m==='vol'?S.reduce((a,s)=>a+s.r,0):Math.max(...S.map(s=>s.r));
 if(m==='top')return Math.max(...S.map(s=>s.w||0));
 if(m==='e1rm')return Math.max(...S.map(s=>(s.w||0)*(1+Math.min(s.r,15)/30)));
 return S.reduce((a,s)=>a+(s.w||0)*s.r,0);
}
const mLabel=(unit,m)=>unit==='corpo'?(m==='vol'?'Reps totais':'Máx reps'):unit==='cardio'?(m==='vol'?'Minutos':'Minutos'):({top:'Carga máx',e1rm:'1RM estimado',vol:'Volume'})[m];
function history(exId){const out=[];for(let i=sessions.length-1;i>=0;i--){const s=sessions[i];const e=s.ex.find(x=>x.id===exId);if(e&&validSets(e.sets,e.unit).length)out.push({date:s.date,ts:s.ts,e,s})}return out}
function lastFor(exId){for(const s of sessions){const e=s.ex.find(x=>x.id===exId);if(e&&validSets(e.sets,e.unit).length)return {date:s.date,e}}return null}
function summarize(sets,unit){
 const S=validSets(sets,unit);const u=UNITS[unit]||UNITS.kg;
 if(unit==='corpo')return S.map(s=>s.r).join(', ')+' reps';
 if(unit==='cardio')return S.map(s=>fmtN(s.w)+' min'+(s.r!=null?' · '+fmtN(s.r)+' km/h':'')).join(' / ');
 return S.map(s=>fmtN(s.w)+'×'+s.r).join(' · ')+' '+u.l;
}
function overTop(e,reps){const t=topReps(reps);return !!t&&e.unit!=='cardio'&&validSets(e.sets,e.unit).some(s=>s.r>t)}
const overMsg=ex=>`Passou de ${topReps(ex.reps)} reps: `+(ex.unit==='corpo'?'adicione carga ou troque o exercício':'suba a carga ou troque o exercício');
// Descanso: compostos 2:30, isoladores 1:45, abdômen 45 s
const restOf=ex=>(ex.p||[])[0]==='abdomen'?45:ex.c?150:105;
function hitTop(e,reps){const t=topReps(reps);if(!t||e.unit==='cardio')return false;const S=validSets(e.sets,e.unit);return S.length>0&&S.every(s=>s.r>=t)}

const e1=(w,r)=>w*(1+Math.min(r,15)/30);

function prTarget(ex){if(ex.unit==='cardio')return null;const H=history(ex.id);if(!H.length)return null;
 if(ex.unit==='corpo')return (Math.max(...H.map(x=>metric(x.e.sets,x.e.unit,'top')))+1)+' reps';
 const best=Math.max(...H.map(x=>metric(x.e.sets,x.e.unit,'e1rm')));const L=validSets(H[H.length-1].e.sets,H[H.length-1].e.unit);const w0=Math.max(0,...L.map(s=>s.w||0));if(!w0)return null;
 const st=stepOf(ex),top=topReps(ex.reps)||10,lo=repLo(ex.reps),mx=maxOf(ex),opts=[];
 // Só sugere recorde dentro da faixa do exercício
 for(const w of [w0,w0+st,w0+2*st]){if(mx!=null&&w>mx)break;let r=1;while(r<=15&&e1(w,r)<=best+1e-9)r++;r=Math.max(r,lo);if(r<=top&&!opts.some(o=>o[1]===r))opts.push([w,r]);if(opts.length===2)break}

function weekMissions(w){let x=0;for(const ch of w)x=(Math.imul(x,31)+ch.charCodeAt(0))>>>0;const idx=[];
 while(idx.length<3){x=(Math.imul(x,1103515245)+12345)>>>0;const i=(x>>>16)%MISSIONS.length;if(!idx.includes(i))idx.push(i)}return idx.map(i=>MISSIONS[i])}

// ---------- Modo game ----------
function levelOf(total,base,inc){let lvl=1,into=total,need=base;while(lvl<MAX_LVL&&into>=need){into-=need;lvl++;need=base+inc*(lvl-1)}return {lvl,into,need}}
// Tudo sai do histórico: apagar ou importar treinos recalcula XP, nível e conquistas.
const RANKS=[['⚙️','Ferro'],['🥉','Bronze'],['🥈','Prata'],['🥇','Ouro'],['💠','Platina'],['💎','Diamante'],['⚡','Ascendente'],['👑','Imortal'],['☀️','Radiante']];
const MAX_LVL=25;
const rankOf=l=>{const t=Math.min(8,Math.floor((l-1)/3));return [RANKS[t][0],RANKS[t][1]+(t<8?' '+((l-1)%3+1):'')]};
const fmtInt=n=>Math.round(n).toLocaleString('pt-BR');
function xpReport(src=sessions){
 const list=src.slice().sort((a,b)=>a.ts<b.ts?-1:1);const best={},bestW={},per={},weeks={};
 let total=0,prsAll=0,fast=0,legs=0,grit=0;
 list.forEach(s=>{let x=0,prs=0;
  let prc=0;s.ex.forEach(e=>{const S=validSets(e.sets,e.unit);if(!S.length)return;
   bestW[e.id]=Math.max(bestW[e.id]||0,...S.map(z=>z.w||0));
   x+=S.length*((e.p||[])[0]==='abdomen'?5:e.c?15:10);
   if(e.unit==='cardio')return;const v=metric(e.sets,e.unit,e.unit==='corpo'?'top':'e1rm');
   if(best[e.id]!=null&&v>best[e.id]){prs++;if(e.c)prc++}best[e.id]=Math.max(best[e.id]??v,v)});
  const quick=!!s.dur&&s.dur<=LIMIT_MIN;x+=50+prs*50+(quick?20:0);
  per[s.id]={xp:x,prs,prc,quick};total+=x;prsAll+=prs;if(quick)fast++;if(s.ex.some(e=>e.id==='leg_press'))legs++;if(prs&&s.feel&&s.feel<=2)grit++;
  const w=wkOf(s.date);if(!weeks[w])weeks[w]={days:new Set(),list:[]};weeks[w].days.add(s.day);weeks[w].list.push(s)});
 let perfect=0,lateral=0,vfull=0,run=0,bestRun=0,prev=null,missionsDone=0;
 const statOf=o=>({c:primaryCount(o.list),prs:o.list.reduce((a,s)=>a+per[s.id].prs,0),prc:o.list.reduce((a,s)=>a+per[s.id].prc,0),quick:o.list.filter(s=>per[s.id].quick).length,legs:o.list.filter(s=>s.ex.some(e=>e.id==='leg_press')).length,feel:o.list.filter(s=>s.feel).length});
 Object.keys(weeks).sort().forEach(w=>{const o=weeks[w],n=o.days.size,c=primaryCount(o.list);
  if(n>=5){total+=200;perfect++}else if(n>=4)total+=100;
  const st=statOf(o);weekMissions(w).forEach(m=>{if(m[3](st)){total+=m[2];missionsDone++}});
  if((c.ombro_lateral||0)>=8)lateral++;if(vScore(c)>=100)vfull++;
  const cons=prev&&wkOf(dstr(new Date(new Date(prev+'T12:00:00').getTime()+7*864e5)))===w;run=n>=4?(cons?run+1:1):0;bestRun=Math.max(bestRun,run);prev=w});
 const cur=wkOf(todayStr());let streak=(weeks[cur]?.days.size||0)>=4?1:0;const d=new Date(cur+'T12:00:00');
 for(;;){d.setDate(d.getDate()-7);if((weeks[dstr(d)]?.days.size||0)>=4)streak++;else break}
 const cw=weeks[cur],cst=cw?statOf(cw):null;const missions=weekMissions(cur).map(m=>({id:m[0],label:m[1],xp:m[2],done:!!cst&&m[3](cst)}));
 const {lvl,into,need}=levelOf(total,800,250);
 return {total,per,lvl,into,need,streak,bestRun,perfect,prsAll,fast,legs,grit,lateral,vfull,missions,missionsDone,best:bestW,count:list.length,weekDays:weeks[cur]?weeks[cur].days.size:0}}

const seasonOf=ds=>{const [y,m]=ds.split('-').map(Number);return {key:y+'-'+Math.ceil(m/3),q:Math.ceil(m/3),y}};
function seasonInfo(key){const r=xpReport(sessions.filter(s=>seasonOf(s.date).key===key));return {...levelOf(r.total,300,100),total:r.total,count:r.count}}
function seasonEnd(){const n=new Date();return new Date(n.getFullYear(),Math.ceil((n.getMonth()+1)/3)*3,1)}
function pastSeasons(){const cur=seasonOf(todayStr()).key;return [...new Set(sessions.map(s=>seasonOf(s.date).key))].filter(k=>k!==cur).sort().reverse()}

function weekRecap(){const ws=wkOf(todayStr());const d=new Date(ws+'T12:00:00');d.setDate(d.getDate()-7);const ps=dstr(d);
 const before=sessions.filter(s=>s.date<ps),upto=sessions.filter(s=>s.date<ws),wk=upto.filter(s=>s.date>=ps);if(!wk.length)return null;
 const a=xpReport(before),b=xpReport(upto);const prs=wk.reduce((x,s)=>x+(b.per[s.id]?b.per[s.id].prs:0),0);
 const days=new Set(wk.map(s=>s.day)).size,ms=weekMissionsDone(ps,wk,b);const end=new Date(d);end.setDate(end.getDate()+6);
 return {ps,from:fmtD(ps),to:fmtD(dstr(end)),days,prs,xp:b.total-a.total,v:vScore(primaryCount(wk)),ms,lvlA:a.lvl,lvlB:b.lvl}}
function weekMissionsDone(w,list,rep){const st={c:primaryCount(list),prs:list.reduce((a,s)=>a+rep.per[s.id].prs,0),prc:list.reduce((a,s)=>a+rep.per[s.id].prc,0),quick:list.filter(s=>rep.per[s.id].quick).length,legs:list.filter(s=>s.ex.some(e=>e.id==='leg_press')).length,feel:list.filter(s=>s.feel).length};
 return weekMissions(w).map(m=>({label:m[1],xp:m[2],done:m[3](st)}))}
function rRecap(r){const ra=rankOf(r.lvlA).join(' '),rb=rankOf(r.lvlB).join(' ');

function rGameChip(){const r=xpReport();const [emo,name]=rankOf(r.lvl);const pct=r.lvl>=MAX_LVL?100:r.into/r.need*100;
 return `<div class="game" data-act="game"><span class="rank">${emo}</span><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-size:14px"><b>${name}</b><span class="r2">${fmtInt(r.total)} XP</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="r2" style="margin-top:4px">Semana ${r.weekDays}/5 · 🎯 ${r.missions.filter(m=>m.done).length}/3${r.streak?` · 🔥 ${r.streak} ${r.streak===1?'semana':'semanas'} seguidas`:''}</div></div><span class="r2">›</span></div>`}
function rGame(){const r=xpReport();const [emo,name]=rankOf(r.lvl);const nx=r.lvl<MAX_LVL?rankOf(r.lvl+1).join(' '):null;const got=ACH.filter(a=>a[3](r)).length;
 return `<h3>${emo} ${name}</h3><div class="bar" style="height:10px"><i style="width:${r.lvl>=MAX_LVL?100:r.into/r.need*100}%"></i></div><div class="exm" style="margin:6px 0 12px">${nx?`Faltam ${fmtInt(r.need-r.into)} XP para ${nx}`:'Rank máximo'} · ${fmtInt(r.total)} XP no total</div>`+
 `<div class="stats"><div class="stat"><div class="v">${r.count}</div><div class="k">treinos</div></div><div class="stat"><div class="v">${r.prsAll}</div><div class="k">recordes</div></div><div class="stat"><div class="v">${r.streak}</div><div class="k">semanas seguidas</div></div></div>`+
 `<div class="h2">Temporada ${seasonOf(todayStr()).q} · ${seasonOf(todayStr()).y}</div><div class="card">${(()=>{const si=seasonInfo(seasonOf(todayStr()).key);const [e,n]=rankOf(si.lvl);const left=Math.ceil((seasonEnd()-Date.now())/864e5);
  return `<div style="display:flex;align-items:center;gap:12px"><span class="rank">${e}</span><div style="flex:1"><div style="display:flex;justify-content:space-between"><b>${n}</b><span class="r2">${fmtInt(si.total)} XP</span></div><div class="bar"><i style="width:${si.lvl>=MAX_LVL?100:si.into/si.need*100}%"></i></div><div class="r2" style="margin-top:4px;font-size:12px;color:var(--mut)">Termina em ${left} ${left===1?'dia':'dias'} · o rank da temporada zera, o total continua</div></div></div>`+
  (pastSeasons().length?`<div class="r2" style="margin-top:10px;font-size:12px;color:var(--mut)">Temporadas anteriores: ${pastSeasons().map(k=>{const s=seasonInfo(k);const [e,n]=rankOf(s.lvl);const [y,q]=k.split('-');return `${e} ${n} (T${q}/${y})`}).join(' · ')}</div>`:'')})()}</div>`+
 (weekRecap()?`<button class="ghost" style="width:100%;padding:12px;margin-bottom:4px" data-act="recap">Resumo da semana passada</button>`:'')+
 `<div class="h2">Missões da semana</div><div class="card">${r.missions.map(m=>`<div class="row"><span class="r1" style="${m.done?'color:var(--acc)':''}">${m.done?'✅':'🎯'} ${m.label}</span><span class="r2">+${m.xp} XP</span></div>`).join('')}</div>`+
 `<div class="h2">Conquistas · ${got}/${ACH.length}</div><div class="ach">${ACH.map(([e,l,d,f])=>`<div class="${f(r)?'':'off'}"><span>${e}</span><b>${l}</b><small>${d}</small></div>`).join('')}</div>`+

// ---------- Banco no Mac ----------
// O app continua salvando no celular; quando o Mac responde, manda tudo e recebe o estado do banco.
// Em cada registro vale o "u" (hora da última mudança) mais recente; apagar vira lápide para o Mac saber.
const TOMB0=()=>({s:{},bw:{},n:{}});
function markDel(kind,key){const t=LS.get('tomb_v1',TOMB0());t[kind][key]=Date.now();LS.set('tomb_v1',t)}
function unmarkDel(kind,key){const t=LS.get('tomb_v1',TOMB0());if(key in t[kind]){delete t[kind][key];LS.set('tomb_v1',t)}}
const uS=s=>s.u||Date.parse(s.ts)||1,uB=b=>b.u||Date.parse(b.date)||1;
var Sync={busy:false,again:false,quiet:false,t:null,
 on(){return !!(cfg.srv&&cfg.tok)},
 url(){return cfg.srv.trim().replace(/\/+$/,'')+'/api/sync'},
 soon(){if(this.quiet||!this.on())return;clearTimeout(this.t);this.t=setTimeout(()=>{this.t=null;this.run()},300)},
 // Saindo do app com envio pendente: manda já, só o que mudou, com keepalive para o iPhone não cortar no meio
 flush(){if(!this.t)return;clearTimeout(this.t);this.t=null;this.run(false,true)},
 payload(since=0){const t=LS.get('tomb_v1',TOMB0()),nu=LS.get('notes_u',{});
  return {sessions:[...sessions.filter(s=>uS(s)>since).map(s=>({...s,u:uS(s)})),...Object.entries(t.s).map(([id,u])=>({id,u,del:true}))],
   bw:[...bw.filter(b=>uB(b)>since).map(b=>({...b,u:uB(b)})),...Object.entries(t.bw).map(([date,u])=>({date,u,del:true}))],
   notes:[...Object.entries(notes).filter(([id])=>(nu[id]||1)>since).map(([id,text])=>({id,text,u:nu[id]||1})),...Object.entries(t.n).map(([id,u])=>({id,u,del:true}))],
   plan:LS.get('plan_u',1)>since?{data:plan,u:LS.get('plan_u',1)}:null}},
 async run(manual,leaving){if(!this.on())return;if(this.busy&&!leaving){this.again=true;return}this.busy=true;
  const body=JSON.stringify(this.payload(leaving?Math.max(0,LS.get('sync_at',0)-60000):0));
  try{const r=await fetch(this.url(),{method:'POST',keepalive:!!leaving&&body.length<60000,headers:{'Authorization':'Bearer '+cfg.tok.trim(),'Content-Type':'application/json'},body});
   if(!r.ok)throw new Error(r.status===401?'token inválido':'erro '+r.status);
   const ch=this.merge(await r.json());LS.set('sync_at',Date.now());LS.set('sync_err','');
   if(ch){this.quiet=true;cache();LS.set('notes_v1',notes);this.quiet=false;if(!$('#modal').classList.contains('show'))render()}
   if(manual)toast(ch?'Sincronizado: chegou coisa nova do Mac':'Sincronizado com o Mac')}
  catch(e){LS.set('sync_err',String(e.message||e));if(manual)toast('Não conectou com o Mac: '+(e.message||e))}
  this.busy=false;showAwake();const el=$('#syncinfo');if(el)el.textContent=syncInfo();
  if(this.again){this.again=false;this.run()}},
 merge(d){let ch=false;const t=LS.get('tomb_v1',TOMB0()),nu=LS.get('notes_u',{});
  const ms=new Map(sessions.map(s=>[s.id,s]));let sc=false;
  (d.sessions||[]).forEach(r=>{const l=ms.get(r.id),lu=l?uS(l):(t.s[r.id]||0);if(r.u<=lu)return;
   if(r.del){if(l){ms.delete(r.id);sc=true}t.s[r.id]=r.u;return}
   delete t.s[r.id];const {del,...x}=r;ms.set(r.id,x);sc=true});
  if(sc){sessions=[...ms.values()];sortS();ch=true}
  const mb=new Map(bw.map(b=>[b.date,b]));let bc=false;
  (d.bw||[]).forEach(r=>{const l=mb.get(r.date),lu=l?uB(l):(t.bw[r.date]||0);if(r.u<=lu)return;
   if(r.del){if(l){mb.delete(r.date);bc=true}t.bw[r.date]=r.u;return}
   delete t.bw[r.date];mb.set(r.date,{date:r.date,kg:r.kg,u:r.u});bc=true});
  if(bc){bw=[...mb.values()].sort((a,b)=>a.date<b.date?-1:1);ch=true}
  (d.notes||[]).forEach(r=>{const has=r.id in notes,lu=has?(nu[r.id]||1):(t.n[r.id]||0);if(r.u<=lu)return;
   if(r.del){if(has){delete notes[r.id];ch=true}delete nu[r.id];t.n[r.id]=r.u;return}
   delete t.n[r.id];notes[r.id]=r.text;nu[r.id]=r.u;ch=true});
  if(d.plan&&d.plan.data&&d.plan.data.days&&d.plan.u>LS.get('plan_u',1)){plan=d.plan.data;LS.set('plan_u',d.plan.u);ch=true}
  LS.set('tomb_v1',t);LS.set('notes_u',nu);return ch}};
function syncInfo(){if(!Sync.on())return 'Desligado: preencha o endereço e o token.';const at=LS.get('sync_at',0),err=LS.get('sync_err',''),q=x=>new Date(x).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 return err?`Sem conexão (${err}).${at?' Última vez: '+q(at):''}`:at?'Última sincronização: '+q(at):'Ainda não sincronizou.'}

function ph(ex,last,i){

  return {w:s.w,r:s.r}}

function chart(pts,unit){
 if(!pts.length)return '<div class="empty">Sem dados ainda</div>';
 const W=340,H=170,pl=38,pr=14,pt=14,pb=26;
 const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const py=(mx-mn)*.12;mn-=py;mx+=py;
 const X=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
 const Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 let g='';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;const y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#2b2f37"/><text x="${pl-6}" y="${y+4}" fill="#8d939e" font-size="10" text-anchor="end">${fmtN(v)}</text>`}
 const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 const area=pts.length>1?`<path d="${d} L${X(pts.length-1)} ${H-pb} L${X(0)} ${H-pb}Z" fill="rgba(143,125,255,.14)"/>`:'';
 const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?4.5:3}" fill="#8f7dff"/>`).join('');
 const xl=`<text x="${X(0)}" y="${H-8}" fill="#8d939e" font-size="10" text-anchor="${pts.length>1?'start':'middle'}">${fmtD(pts[0].x)}</text>`+(pts.length>1?`<text x="${X(pts.length-1)}" y="${H-8}" fill="#8d939e" font-size="10" text-anchor="end">${fmtD(pts[pts.length-1].x)}</text>`:'');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${area}<path d="${d}" fill="none" stroke="#8f7dff" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

 const days=new Date(y,m+1,0).getDate(),lead=(base.getDay()+6)%7;const by={};sessions.forEach(s=>{(by[s.date]=by[s.date]||[]).push(s)});
 const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
 let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
 for(let d=1;d<=days;d++){const ds=y+'-'+pad(m+1)+'-'+pad(d);const ss=by[ds];const f=ss&&ss.find(s=>s.feel)?.feel;
  const cls=!ss?'':!f?'done':f<=2?'low':f===3?'mid':'hi';cells+=`<span class="${cls} ${ds===todayStr()?'today':''}" ${ss?`data-act="calday" data-k="${ss[0].id}"`:''}>${d}</span>`}
 const cnt=Object.keys(by).filter(k=>k.startsWith(y+'-'+pad(m+1))).length;
 return `<div class="card"><div class="calhead"><button data-act="calprev">‹</button><b>${MES[m]} ${y}</b><button data-act="calnext" ${ui.calM>=0?'disabled':''}>›</button></div><div class="cal">${['S','T','Q','Q','S','S','D'].map(x=>`<i>${x}</i>`).join('')}${cells}</div><div class="r2" style="margin-top:8px;font-size:12px;color:var(--mut)">${cnt} ${cnt===1?'treino':'treinos'} no mês · cor = como se sentiu: <span class="dot hi"></span> forte <span class="dot mid"></span> normal <span class="dot low"></span> cansado</div></div>`}
function rHistorico(){
 if(!sessions.length)return `<div class="empty">Nenhum treino finalizado ainda.</div>`+rBanco()+rAjustes()+rBackup();
 return rCal()+sessions.slice(0,60).map(s=>{const dn=DAYS.find(d=>d[0]===s.day);const open=ui.open===s.id;const fl=feelOf(s);
  return `<div class="card" data-sess="${s.id}"><div class="row" style="padding:0;border:0" data-act="hopen" data-k="${s.id}"><div><div class="r1">${dn?dn[2]:''} · ${fmtD(s.date)}${fl?' '+fl[1]:''}</div><div class="r2">${esc(s.dayName||'')} · ${s.ex.length} exercícios${s.dur?' · '+s.dur+' min':''}${fl?' · '+fl[2]:''}</div></div><span class="r2">${open?'▲':'▼'}</span></div>`+
  (open?`<div style="margin-top:12px"><div class="feelq">Como você se sentiu?</div>${feelRow(s)}${s.ex.map(e=>`<div class="sumx"><b>${esc(e.name)}</b><div class="r2" style="color:var(--mut)">${esc(summarize(e.sets,e.unit))}</div></div>`).join('')}<button class="link danger" data-act="hdel" data-k="${s.id}">Apagar este treino</button></div>`:'')+`</div>`}).join('')+rBanco()+rAjustes()+rBackup();
}
